<!-- 💼 Custom Ad Banner -->
<div class="custom-ad-banner">
  <a href="https://wa.me/2348135047400?text=Hello!%20I%20want%20to%20advertise%20on%20your%20CBT%20platform." target="_blank">
    <img src="{{ url_for('static', filename='images/advertise_here.png') }}" alt="Advertise Here" />
  </a>
</div>

<script>
  const adImages = [
    "{{ url_for('static', filename='images/advertise_here.png') }}",
    "{{ url_for('static', filename='images/ad_school_event.png') }}",
    "{{ url_for('static', filename='images/ad_tutorial.png') }}"
  ];
  let current = 0;
  const adImg = document.querySelector(".custom-ad-banner img");
  setInterval(() => {
    current = (current + 1) % adImages.length;
    adImg.src = adImages[current];
  }, 8000); // change every 8 seconds
</script>
