<div class="ad-banner-container">
  <div id="ad-banner-slot"></div>
</div>

<script>
  const BANNER_AD_KEY = "banner_ad_last_shown";
  const BANNER_INTERVAL = 2 * 60 * 60 * 1000; // 2 hours

  function showBannerAd() {
    const lastShown = localStorage.getItem(BANNER_AD_KEY);
    if (!lastShown || Date.now() - lastShown > BANNER_INTERVAL) {
      const container = document.getElementById("ad-banner-slot");

      // Adsterra configuration script
      const configScript = document.createElement("script");
      configScript.type = "text/javascript";
      configScript.text = `
        atOptions = {
          'key' : '97fb67ba8a001947ee9a5b8c84c84550',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      `;
      container.appendChild(configScript);

      // Adsterra invoke script
      const invokeScript = document.createElement("script");
      invokeScript.type = "text/javascript";
      invokeScript.src = "//www.highperformanceformat.com/97fb67ba8a001947ee9a5b8c84c84550/invoke.js";
      container.appendChild(invokeScript);

      localStorage.setItem(BANNER_AD_KEY, Date.now());
    }
  }

  showBannerAd();
</script>
