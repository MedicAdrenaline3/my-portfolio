<!-- ✅ Adsterra Native Banner (2-hour limit, no countdown) -->
<div class="ad-native-container">
  <div id="ad-native-banner"></div>
</div>

<script>
  const NATIVE_AD_KEY = "native_ad_last_shown";
  const NATIVE_INTERVAL = 2 * 60 * 60 * 1000; // 2 hours

  function showNativeAd() {
    const lastShown = localStorage.getItem(NATIVE_AD_KEY);
    if (!lastShown || Date.now() - lastShown > NATIVE_INTERVAL) {
      document.getElementById("ad-native-banner").innerHTML = `
        <script async="async" data-cfasync="false" src="//pl27920567.effectivegatecpm.com/5dd19c795872d55603885ecd7e3642a5/invoke.js"><\/script>
        <div id="container-5dd19c795872d55603885ecd7e3642a5"></div>
      `;
      localStorage.setItem(NATIVE_AD_KEY, Date.now());
    }
  }

  showNativeAd();
</script>

<style>
  .ad-native-container {
    text-align: center;
    margin: 10px 0;
    background: #f8f8f8;
    border-radius: 8px;
    padding: 6px;
  }
</style>
