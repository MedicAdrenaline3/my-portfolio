<!-- ✅ Adsterra Native Banner (2-hour limit, no countdown) -->
<div class="ad-native-container">
  <div id="ad-native-banner"></div>
</div>

<script>
  const NATIVE_AD_KEY = "native_ad_last_shown";
  const NATIVE_INTERVAL = 2 * 60 * 60 * 1000; // 2 hours

  function showNativeAd() {
    const lastShown = localStorage.getItem(NATIVE_AD_KEY);
    if (!lastShown || Date.now() - lastShown > NATIVE_INTERVAL) {
      const adDiv = document.getElementById("ad-native-banner");

      // Create the Adsterra script dynamically
      const adScript = document.createElement("script");
      adScript.async = true;
      adScript.dataset.cfasync = "false";
      adScript.src = "//pl27920567.effectivegatecpm.com/5dd19c795872d55603885ecd7e3642a5/invoke.js";

      // Create the ad container
      const adContainer = document.createElement("div");
      adContainer.id = "container-5dd19c795872d55603885ecd7e3642a5";

      // Append to the banner div
      adDiv.innerHTML = "";
      adDiv.appendChild(adScript);
      adDiv.appendChild(adContainer);

      localStorage.setItem(NATIVE_AD_KEY, Date.now());
    }
  }

  showNativeAd();
</script>

<style>
  .ad-native-container {
    text-align: center;
    margin: 10px 0;
    background: #f8f8f8;
    border-radius: 8px;
    padding: 6px;
  }
</style>
