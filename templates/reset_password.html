{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="form-container mt-5" style="color: black; font-size: large; font-weight: bold;">
  <h2 class="text-center mb-4" style="color: black; font-size: xx-large; font-weight: bold;">RESET YOUR PASSWORD</h2>

  <form action="{{ url_for('reset_password') }}" method="POST">
    <!-- New Password -->
    <div class="form-group">
      <label for="new_password" style="color: black; font-size: x-large; font-weight: bold;">New Password</label>
      <div class="input-container" style="position: relative; width: 80%;">
        <input type="password" id="new_password" name="new_password" placeholder="Enter new password"
          required style="width: 100%; padding-right: 40px; font-size: large;">
        <span class="toggle-icon"
          onclick="toggleVisibility(this)"
          style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span>
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="form-group">
      <label for="confirm_password" style="color: black; font-size: x-large; font-weight: bold;">Confirm Password</label>
      <div class="input-container" style="position: relative; width: 80%;">
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password"
          required style="width: 100%; padding-right: 40px; font-size: large;">
        <span class="toggle-icon"
          onclick="toggleVisibility(this)"
          style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span>
      </div>
    </div>

    <!-- Token -->
    <div class="form-group">
      <label for="token" style="color: black; font-size: x-large; font-weight: bold;">Enter Token</label>
      <div class="input-container" style="position: relative; width: 80%;">
        <input type="text" id="token" name="token" placeholder="Enter reset token"
          required style="width: 100%; font-size: large;">
      </div>
    </div>

    <button type="submit" class="btn" style="width: auto; padding: 10px 25px;">Reset Password</button>
  </form>
</div>

<script>
  function toggleVisibility(icon) {
    const input = icon.previousElementSibling;
    if (input.type === "password") {
      input.type = "text";
      icon.textContent = "🙈";
    } else {
      input.type = "password";
      icon.textContent = "👁️";
    }
  }
</script>
{% endblock %}
