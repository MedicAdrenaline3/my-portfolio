{% extends "base.html" %}

{% block title %}JAMB CBT | Welcome{% endblock %}

{% block content %}

<style>
  .welcome-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem;
    margin-top: 1rem;
    text-align: center;
    position: relative;
    min-height: 100vh;
    box-sizing: border-box;
  }

  body {
  position: relative;
  min-height: 100vh;
  margin: 0;
  background: linear-gradient(to right, #007a3d, #ffffff);
  overflow-x: hidden;
}

/* Add a blurred centered logo overlay */
body::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 600px; /* adjust size as needed */
  height: 400px;
  background: url("{{ url_for('static', filename='images/jamb_background.jpg') }}") no-repeat center center;
  background-size: contain;
  opacity: 0.30; /* faint */
  filter: blur(4px); /* creates that soft blur */
  transform: translate(-50%, -50%);
  z-index: 0; /* behind all content */
}

/* Make sure all page content stays above the blurred logo */
* {
  position: relative;
  z-index: 1;
}

  .header-container img {
    position: absolute;
    height: auto;
    margin-bottom: 1rem;
    width: 100px;             /* adjust for size */
    height: auto;            /* keep proportions */
    border-radius: 10px;     /* optional — soft corners */
    opacity: 2.0;            /* slightly subtle */
    transition: transform 0.3s ease, opacity 0.3s ease;
    top: -25px;               /* space from the top */
    right: 300px;             /* space from the right edge */
}

  .header-container img:hover {
    transform: scale(1.05);
    opacity: 1;}

  #welcome-text-container {
    font-size: 1.6rem;
    position: absolute;
    top: 15%;
    font-style: italic;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    font-weight: bolder;
    color: black;
    min-height: 60px;
    margin: 1rem 0;
    width: 85%;
    max-width: 700px;
  }

  .cursor {
    display: inline-block;
    color: #004225;
    font-weight: bolder;
    animation: blink 0.7s steps(2, start) infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .auth-buttons {
    display: flex;
    gap: 1rem;
    margin-top: auto;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .auth-buttons a {
    background-color: #004225;
    color: white;
    font-weight: bold;
    padding: 0.6rem 1.2rem;
    font-size: 1.1rem;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.3s ease-in-out;
  }

  .auth-buttons a:hover {
    background-color: #007a3d;
  }

  .info-links {
    position: absolute;
    top: 220px;
    left: -15px;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    align-items: flex-start;
    z-index: 100;
  }

  .info-links a {
    color: white;
    font-size: 1rem;
    font-weight: bolder;
    text-decoration: underline;
    background-color: rgba(0, 0, 0, 0.753);
    padding: 4px 8px;
    border-radius: 5px;
  }

  @media (min-width: 768px) {
    #welcome-text-container {
      font-size: 2rem;
    }

    .auth-buttons a {
      font-size: 1.4rem;
    }

    .info-links a {
      font-size: 1.1rem;
    }
  }

  #countdown-container {
    position: absolute;
    top: -5%;
    right: 1%;
    margin-top: 50px;
    margin-bottom: 30px;
    color: #004225;
  }

  #countdown {
    position: absolute;
    top: 80%;
    right: 15%;
    background-color: #f0f0f0;
    display: inline-block;
    padding: 5px 10px;
    border-radius: 10px;
    color: #333;
  }
</style>

<!-- Countdown Section -->
<div id="countdown-container" class="text-center">
  <h2 style="color: red; font-weight: bold; font-size: 1.3rem; font-style: italic;">⏳ JAMB CBT Countdown:</h2>
  <div id="countdown" style="font-size: 1.0rem; font-weight: bold;"></div>
</div>

<div class="welcome-container">
  <div class="header-container">
    <img src="{{ url_for('static', filename='images/adrena_logo.jpg') }}" alt="Adrena Logo">
  </div>

  <div id="welcome-text-container">
    <span id="welcome-text" class="welcome-text"></span><span class="cursor">|</span>
  </div>

  <div class="auth-buttons">
    <a href="{{ url_for('register') }}">Register</a>
    <a href="{{ url_for('login') }}">Login</a>
  </div>

  <div class="info-links">
    <a href="/app-instructions">App Info (Read me)</a>
    <a href="/jamb-instructions">JAMB Instructions</a>
    <a href="/courses-subject">Courses & Subject-combination</a>
    <a href="/adrena-ai">Adrena AI</a>
    <a href="/updates">Admission Updates</a>
    <a href="/donate_pq">Donate/Download PQs</a>
    <a href="https://wa.me/2348135047400" target="_blank">Any issue? Contact Admin</a></strong>
</div>

  <audio id="typing-sound" src="{{ url_for('static', filename='sounds/typin.mp3') }}"></audio>
</div>

<script>
  const messages = [
    "Hello dear Jambites 👋, welcome to Adrena JAMB CBT!",
    "I'm Adrena AI — your exam buddy and smart guide 🤖.",
    "Ready to test your JAMB skills?",
    "Be calm, focused, and confident — you've got this 💪.",
    "Did you know? Practicing CBT-style questions boosts your real exam speed!",
    "Every second counts — manage your time wisely ⏰.",
    "Need help? Adrena AI is right here to assist you 🧠.",
    "Please read the JAMB CBT instructions carefully before starting your test.",
    "Access all four subjects — English and three of your choice 📚.",
    "Get real-time grading, instant feedback, and performance tracking ✅.",
    "Learn smart. Practice consistently. Excel in your JAMB CBT 🏆."
  ];

  const textElement = document.getElementById("welcome-text");
  const typingSound = document.getElementById("typing-sound");
  let msgIndex = 0;

  function typeMessage(text, charIndex = 0) {
    if (charIndex < text.length) {
      textElement.textContent += text.charAt(charIndex);
      typingSound.currentTime = 0;
      typingSound.play();
      setTimeout(() => typeMessage(text, charIndex + 1), 150);
    } else {
      setTimeout(() => {
        textElement.style.opacity = 0;
        setTimeout(() => {
          textElement.textContent = "";
          textElement.style.opacity = 1;
          msgIndex = (msgIndex + 1) % messages.length;
          typeMessage(messages[msgIndex]);
        }, 500);
      }, 2000);
    }
  }

  typeMessage(messages[msgIndex]);

  // Countdown Timer
  const countdownTarget = new Date("2026-04-01T06:00:00").getTime(); // Set JAMB 2026 exam date here

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = countdownTarget - now;

    if (distance < 0) {
      document.getElementById("countdown").innerHTML = "🎯 Exam Day is Here! Best of Luck!";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>

{% endblock %}
