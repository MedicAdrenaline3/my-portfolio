{% extends "base.html" %}

{% block title %}JAMB CBT | Welcome{% endblock %}

{% block content %}
<style>
  body {
    position: relative;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(to right, #007a3d, #ffffff);
    overflow-x: hidden;
  }

  /* Blurred Background Logo */
  body::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 85vw;
    height: 45vh;
    background: url("{{ url_for('static', filename='images/jamb_background.jpg') }}") no-repeat center center;
    background-size: contain;
    opacity: 0.25;
    filter: blur(5px);
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  * {
    position: relative;
    z-index: 1;
  }

  .welcome-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 1.5rem;
    height: 100vh;
    box-sizing: border-box;
  }

  /* === Countdown (Top Right) === */
  #countdown-container {
    position: absolute;
    top: 10px;
    right: 15px;
    color: #004225;
    text-align: right;
  }

  #countdown-container h2 {
    font-size: 1rem;
    color: red;
    font-weight: bold;
    font-style: italic;
    margin: 0;
  }

  #countdown {
    background-color: #f0f0f0;
    display: inline-block;
    padding: 4px 8px;
    border-radius: 8px;
    color: #333;
    margin-top: 2px;
    font-size: 0.9rem;
    font-weight: bold;
  }

  /* === Logo (Top Left) === */
  .header-container {
    position: absolute;
    top: 7px;
    left: 1px;
  }

  .header-container img {
    width: 110px;
    height: auto;
    border-radius: 10px;
    transition: transform 0.3s ease;
  }

  .header-container img:hover {
    transform: scale(1.05);
  }

  /* === Info Links (Below Logo) === */
  .info-links {
    position: absolute;
    top: 220px;
    left: 10px;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    align-items: flex-start;
  }

  .info-links a {
    color: white;
    font-size: 0.9rem;
    font-weight: bolder;
    text-decoration: underline;
    background-color: rgba(0, 0, 0, 0.6);
    padding: 4px 8px;
    border-radius: 5px;
    text-align: left;
  }

  /* === Typing Text (Center) === */
  #welcome-text-container {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    max-width: 700px;
    font-size: 1.3rem;
    font-style: italic;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    font-weight: bolder;
    color: black;
  }

  .cursor {
    display: inline-block;
    color: #004225;
    font-weight: bolder;
    animation: blink 0.7s steps(2, start) infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* === Register/Login Buttons (Bottom Center) === */
  .auth-buttons {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    justify-content: center;
  }

  .auth-buttons a {
    background-color: #004225;
    color: white;
    font-weight: bold;
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.3s ease-in-out;
  }

  .auth-buttons a:hover {
    background-color: #007a3d;
  }

  /* === Responsive Mobile Adjustments === */
  @media (max-width: 650px) {
    .header-container img {
      width: 70px;
    }

    .info-links {
      top: 100px;
      left: 10px;
    }

    .info-links a {
      font-size: 0.8rem;
      padding: 3px 6px;
    }

    #welcome-text-container {
      font-size: 1.2rem;
      top: 45%;
    }

    #countdown-container h2 {
      font-size: 0.9rem;
    }

    #countdown {
      font-size: 0.8rem;
      padding: 3px 6px;
    }

    .auth-buttons {
      bottom: 30px;
    }

    .auth-buttons a {
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
    }
  }
</style>

<!-- Countdown -->
<div id="countdown-container">
  <h2>⏳ JAMB CBT Countdown:</h2>
  <div id="countdown"></div>
</div>

<div class="welcome-container">
  <!-- Logo -->
  <div class="header-container">
    <img src="{{ url_for('static', filename='images/adrena_logo.jpg') }}" alt="Adrena Logo">
  </div>

  <!-- Info Links -->
  <div class="info-links">
    <a href="/app-instructions">App Info (Read me)</a>
    <a href="/jamb-instructions">JAMB Instructions</a>
    <a href="/courses-subject">Courses & Subject-combination</a>
    <a href="/adrena-ai">Adrena AI</a>
    <a href="/updates">Admission Updates</a>
    <a href="/donate_pq">Donate/Download PQs</a>
    <a href="https://wa.me/2348135047400" target="_blank">Any issue? Contact Admin</a>
  </div>

  <!-- Typing Text -->
  <div id="welcome-text-container">
    <span id="welcome-text"></span><span class="cursor">|</span>
  </div>

  <!-- Buttons -->
  <div class="auth-buttons">
    <a href="{{ url_for('register') }}">Register</a>
    <a href="{{ url_for('login') }}">Login</a>
  </div>

  <audio id="typing-sound" src="{{ url_for('static', filename='sounds/typin.mp3') }}"></audio>
</div>

<script>
  const messages = [
    "Hello dear Jambites 👋, welcome to Adrena JAMB CBT!",
    "I'm Adrena AI — your exam buddy and smart guide 🤖.",
    "Ready to test your JAMB skills?",
    "Be calm, focused, and confident — you've got this 💪.",
    "Did you know? Practicing CBT-style questions boosts your real exam speed!",
    "Every second counts — manage your time wisely ⏰.",
    "Need help? Adrena AI is right here to assist you 🧠.",
    "Please read the JAMB CBT instructions carefully before starting your test.",
    "Access all four subjects — English and three of your choice 📚.",
    "Get real-time grading, instant feedback, and performance tracking ✅.",
    "Learn smart. Practice consistently. Excel in your JAMB CBT 🏆."
  ];

  const textElement = document.getElementById("welcome-text");
  const typingSound = document.getElementById("typing-sound");
  let msgIndex = 0;

  function typeMessage(text, i = 0) {
    if (i < text.length) {
      textElement.textContent += text.charAt(i);
      typingSound.currentTime = 0;
      typingSound.play();
      setTimeout(() => typeMessage(text, i + 1), 120);
    } else {
      setTimeout(() => {
        textElement.style.opacity = 0;
        setTimeout(() => {
          textElement.textContent = "";
          textElement.style.opacity = 1;
          msgIndex = (msgIndex + 1) % messages.length;
          typeMessage(messages[msgIndex]);
        }, 500);
      }, 2000);
    }
  }
  typeMessage(messages[msgIndex]);

  const countdownTarget = new Date("2026-04-01T06:00:00").getTime();
  function updateCountdown() {
    const now = new Date().getTime();
    const diff = countdownTarget - now;
    if (diff < 0) {
      document.getElementById("countdown").innerHTML = "🎯 Exam Day is Here! Best of Luck!";
      return;
    }
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById("countdown").innerHTML = `${d}d ${h}h ${m}m ${s}s`;
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
{% endblock %}
